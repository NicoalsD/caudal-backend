name: ci

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: compila, prueba y analiza
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Instala JDK 25 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compila, ejecuta pruebas (Testcontainers), Spotless, Checkstyle y SpotBugs
        run: ./mvnw -B -ntp verify

      - name: Guarda los reportes de pruebas si algo falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-de-pruebas
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 7
