spring:
  application:
    name: caudal-backend
  # Application connection: caudal_app with minimal DML privileges.
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      pool-name: caudal-app
  # Migrations run with the schema owner (caudal_migrator), on the direct connection.
  flyway:
    url: ${FLYWAY_URL}
    user: ${FLYWAY_USER}
    password: ${FLYWAY_PASSWORD}
    locations: classpath:db/migration
    schemas: public
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: false
  # JSON contract in snake_case (docs/API.md, section 1.1).
  jackson:
    property-naming-strategy: SNAKE_CASE
  mvc:
    problemdetails:
      enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  error:
    include-stacktrace: never
    include-message: never
    whitelabel:
      enabled: false

# JSON logs (ECS) with request_id from the MDC and credentials redacted.
logging:
  structured:
    format:
      console: ecs
    json:
      customizer: co.caudal.infrastructure.logging.RedactingJsonMembersCustomizer
  level:
    root: ${LOG_LEVEL:INFO}
    co.caudal: ${LOG_LEVEL:INFO}
