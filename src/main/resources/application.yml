spring:
  application:
    name: caudal-backend
  # Application connection: caudal_app with minimal DML privileges.
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      pool-name: caudal-app
  # Migrations run with the schema owner (caudal_migrator), on the direct connection.
  flyway:
    url: ${FLYWAY_URL}
    user: ${FLYWAY_USER}
    password: ${FLYWAY_PASSWORD}
    locations: classpath:db/migration
    schemas: public
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: false
  # JSON contract in snake_case (docs/API.md, section 1.1).
  jackson:
    property-naming-strategy: SNAKE_CASE
    # Unknown fields are rejected. Coercion of types is off (see JsonStrictnessConfig).
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

# Swagger UI and OpenAPI document; API_DOCS_ENABLED=false turns both into 404.
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    path: /swagger-ui.html
  paths-to-match: /api/v1/**
  default-produces-media-type: application/json

caudal:
  # Demo accounts: created at startup only if SEED_DEMO_DATA=true and DEMO_USER_PASSWORD is set.
  demo:
    enabled: ${SEED_DEMO_DATA:false}
    user-password: ${DEMO_USER_PASSWORD:}
  api-docs:
    server-url: ${API_PUBLIC_URL:http://localhost:8080}
  # Forecast service caudal-ia (docs/Contrato-IA.md). Without a URL every forecast is the simple
  # estimate of the backend.
  ia:
    service-url: ${IA_SERVICE_URL:}
    service-token: ${IA_SERVICE_TOKEN:}
    connect-timeout-ms: ${IA_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${IA_READ_TIMEOUT_MS:10000}
    circuit-breaker:
      failure-threshold: ${CIRCUIT_BREAKER_FAILURE_THRESHOLD:5}
      open-seconds: ${CIRCUIT_BREAKER_OPEN_SECONDS:60}
      half-open-calls: ${CIRCUIT_BREAKER_HALF_OPEN_CALLS:2}
  security:
    # Access token (JWT HS256). Secret, issuer and audience have no default: without them the
    # application does not start.
    jwt:
      secret: ${JWT_SECRET}
      issuer: ${JWT_ISSUER}
      audience: ${JWT_AUDIENCE}
      access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    # Lifetime of the refresh token (session), in days.
    refresh:
      ttl-days: ${REFRESH_TTL_DAYS_DEFAULT:7}
      operator-ttl-days: ${REFRESH_TTL_DAYS_OPERATOR:30}
    # Refresh cookie (caudal_rt). The PWA (Vercel) and the API (Render) are different sites, so the
    # default is SameSite=None, protected by X-Requested-With and the Origin check.
    cookie:
      same-site: ${COOKIE_SAME_SITE:None}
      secure: ${COOKIE_SECURE:true}
    # Browser origins allowed (CORS and the refresh Origin check). No default; never "*".
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
    # Permissions come from iam.role_permissions; they are cached for this many seconds.
    permissions:
      cache-ttl-seconds: ${PERMISSION_CACHE_TTL_SECONDS:60}
    # Lock after consecutive failures (window = first lock) and limit per IP.
    login:
      max-failures: ${LOGIN_MAX_FAILURES:5}
      lock-minutes: ${LOGIN_LOCK_MINUTES:15}
      ip-max-attempts: ${LOGIN_IP_MAX_ATTEMPTS:20}
      ip-window-minutes: ${LOGIN_IP_WINDOW_MINUTES:15}
    # Rate limits shared through PostgreSQL with Bucket4j (docs/Seguridad.md, section 2.10).
    rate-limit:
      login-per-minute: ${RATE_LIMIT_LOGIN_PER_MINUTE:5}
      forecast-per-hour: ${RATE_LIMIT_FORECAST_PER_HOUR:10}
    # Lifetime of the one-time activation and reset codes, in minutes (24 hours by default).
    reset-grant:
      ttl-minutes: ${RESET_GRANT_TTL_MINUTES:1440}
    # Key that hides IP addresses and typed usernames in the database. No default value.
    privacy:
      ip-hmac-key: ${IP_HMAC_KEY}
    # AES-256-GCM key of the TOTP secrets (docs/Seguridad.md, section 2.4). No default value.
    mfa:
      encryption-key: ${MFA_ENCRYPTION_KEY}
      key-id: ${MFA_KEY_ID}
      issuer: ${MFA_ISSUER:CAUDAL}
      allowed-roles: ${MFA_ALLOWED_ROLES:BOARD_ADMIN,PROJECT_TEAM}
    # Argon2id (docs/Seguridad.md, section 2.1). The defaults are the canonical values.
    argon2:
      memory-kib: ${ARGON2_MEMORY_KIB:19456}
      iterations: ${ARGON2_ITERATIONS:2}
      parallelism: ${ARGON2_PARALLELISM:1}
      password-history-size: ${PASSWORD_HISTORY_SIZE:5}

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
    whitelabel:
      enabled: false

# Only the health endpoint is exposed, without details (it is public).
management:
  endpoints:
    access:
      default: none
    web:
      base-path: /actuator
      exposure:
        include: health
  endpoint:
    health:
      access: read-only
      show-details: never
      show-components: never
      probes:
        enabled: true

# JSON logs (ECS) with request_id from the MDC and credentials redacted.
logging:
  structured:
    format:
      console: ecs
    json:
      customizer: co.caudal.infrastructure.logging.RedactingJsonMembersCustomizer
  level:
    root: ${LOG_LEVEL:INFO}
    co.caudal: ${LOG_LEVEL:INFO}
